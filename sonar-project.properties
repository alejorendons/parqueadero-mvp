sonar.projectKey=parqueadero-mvp
sonar.projectName=Parqueadero MVP
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/.wrangler/**,**/coverage/**
# No se excluye la interfaz de la cobertura: SonarQube mostrará sus líneas no cubiertas.
# Cloud analiza el repositorio completo y reconoce tests/ automáticamente.
# Server recibe las rutas de producción/pruebas desde su paso del workflow.
# URL, organización (Cloud) y token se inyectan desde CI, nunca se guardan aquí.
