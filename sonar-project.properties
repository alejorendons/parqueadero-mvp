sonar.projectKey=parqueadero-mvp
sonar.projectName=Parqueadero MVP
sonar.sourceEncoding=UTF-8
sonar.sources=app,application,domain,db
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.mjs,tests/**/*adapter.mjs
